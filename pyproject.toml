[build-system]
requires = ["uv_build<1.0"]
build-backend = "uv_build"

[project]
name = "project"
version = "2026.11.8.0"
description = "Project utilities"
requires-python = ">=3.15"
dependencies = [
  "jinja2",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "pint",
  "pydantic",
  "pygments",
]

[project.optional-dependencies]
tools = [
  "cmake>=4.4",
  "gersemi",
  "pyocd",
]

cli = [
  "typer",
]

[project.scripts]
project = "project.cli.__main__:main"
"project.cli" = "project.cli.__main__:main"

[dependency-groups]
dev = [
  "debugpy",
  "pyrefly",
  "pytest",
  "pytest-xdist",
  "pytest-timeout",
  "pytest-coverage",
  "pytest-randomly",
  "ruff",
  "types-pygments",
  "scalene",
]

[tool.pyrefly]
project-includes = [
  "**/*.py*",
]

[tool.pytest]
cache_dir = ".cache/pytest"
log_file = ".artifacts/logs/pytest.log"
addopts = [
  "--junit-xml=.artifacts/test/pytest.junit.xml",
  "--new-first",
  "--failed-first",
  # "--doctest-modules",
  # "--tb=no"
]
markers = [
  "unit: Fast, isolated tests",
  "integration: Tests that require real executables, services, etc.",
]
junit_logging = "all"
tmp_path_retention_policy = "failed"
# log_auto_indent = true
# log_cli = true
# log_cli_format = ""
log_file_level = "INFO"
testpaths = [
  # "src/project",
  "tests/project",
]
# --collect-only


[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
  "CPY001",  # copyright notice at top of file
  "D",       # docstrings
  "COM812",  # trailing comma conflicts with the formatter
  "E501",    # line too long; formatter fixes this
  "EM101",   # Exception must not use a string literal, assign to a variable first
  "EM102",   # Exception mustnot use an f-string literal, assign to a variable first
  "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "S101",    # Use of `assert` detected
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.setuptools.package-data]
project = ["data/templates/*.j2"]
