[build-system]
requires = ["uv_build<1.0"]
build-backend = "uv_build"

[project]
name = "project"
version = "2026.11.8.0"
description = "Project utilities"
requires-python = ">=3.15"
dependencies = [
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-sdk",
  "pint",
  "pydantic",
]

[project.optional-dependencies]
tools = [
  "cmake>=4.4",
  "gersemi",
  "pyocd",
]

cli = [
  "typer",
]

[project.scripts]
project = "project.cli.__main__:main"
"project.cli" = "project.cli.__main__:main"

[dependency-groups]
dev = [
  "debugpy",
  "pyrefly",
  "pytest",
  "pytest-xdist",
  "pytest-timeout",
  "pytest-coverage",
  "pytest-randomly",
  "ruff",
]

[tool.pyrefly]
project-includes = [
  "**/*.py*",
]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in `**kwargs`
  "CPY001",  # copyright notice at top of file
  "D",       # docstrings
  "COM812",  # trailing comma conflicts with the formatter
  "E501",    # line too long; formatter fixes this
  "EM101",   # Exception must not use a string literal, assign to a variable first
  "EM102",   # Exception mustnot use an f-string literal, assign to a variable first
  "TRY003",  # Avoid specifying long messages outside the exception class
  "T201",    # print found
]

[tool.ruff.lint.per-file-ignores]
"src/project/core/**/*.py" = [
  "S603",    # `subprocess` call: check for execution of untrusted input
]
"src/project/system/program.py" = [
  "S603",    # `subprocess` call: check for execution of untrusted input
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
